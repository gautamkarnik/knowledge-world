<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tacit Mosaic Music Festival</title>
<style>
  :root { --ink:#e8ecf5; --dim:#9aa3b8; --panel:rgba(14,18,32,.86); --line:rgba(255,255,255,.12); }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#05070f; color:var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; overflow:hidden; }
  #hud { position:fixed; top:16px; left:16px; width:280px; padding:14px 16px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; backdrop-filter: blur(8px); z-index:5; }
  #hud h1 { font-size:16px; margin:0 0 2px; letter-spacing:.2px; }
  #hud p { margin:0 0 10px; color:var(--dim); font-size:12px; }
  #hud button { display:flex; align-items:center; gap:8px; width:100%; text-align:left; margin:4px 0; padding:7px 9px;
    background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:8px; color:var(--ink); cursor:pointer; font:inherit; }
  #hud button:hover { background:rgba(255,255,255,.1); }
  #hudClose, #hudOpen { display:none; }
  #hudOpen[hidden] { display:none; }
  #hud .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  #hud .n { margin-left:auto; color:var(--dim); font-size:12px; }
  #hud .hint { margin-top:10px; font-size:11px; color:var(--dim); }
  #panel { position:fixed; top:16px; right:16px; bottom:16px; width:380px; padding:18px 20px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; backdrop-filter: blur(8px); overflow-y:auto; z-index:5;
    transform: translateX(420px); transition: transform .45s cubic-bezier(.2,.8,.2,1); }
  #panel.open { transform: translateX(0); }
  #panel h2 { margin:0; font-size:20px; }
  #panel .meta { color:var(--dim); font-size:12px; margin:4px 0 12px; }
  #panel h3 { font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--dim); margin:16px 0 6px; }
  #panel ul { margin:0; padding-left:18px; } #panel li { margin:4px 0; }
  #panel .ov { color:#cfd5e4; }
  #close { position:absolute; top:12px; right:12px; background:none; border:none; color:var(--dim); font-size:20px; cursor:pointer; }
  .bar { display:flex; height:10px; border-radius:5px; overflow:hidden; margin-top:6px; }
  .legend { display:flex; gap:12px; font-size:11px; color:var(--dim); margin-top:6px; }
  .legend i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; }
  .label { padding:4px 10px; border-radius:999px; background:rgba(10,14,26,.75); border:1px solid var(--line);
    color:var(--ink); font-size:12px; white-space:nowrap; cursor:pointer; pointer-events:auto; user-select:none; }
  .label:hover { background:rgba(40,50,80,.9); }
  .label b { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .star-label { font-size:10px; color:#9fb4ff; opacity:.75; pointer-events:none; letter-spacing:.5px; }
  #loading { position:fixed; inset:0; display:grid; place-items:center; color:var(--dim); z-index:10; background:#05070f; transition:opacity .6s; }
  @media (max-width: 700px) {
    #hud {
      display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:6px;
      top:8px; left:8px; right:8px; width:auto; padding:10px;
    }
    #hud.mobile-hidden { display:none; }
    #hud h1 { grid-column:1; grid-row:1; }
    #hudClose {
      display:flex; grid-column:2; grid-row:1; justify-content:center;
      width:36px; min-height:36px; margin:0; padding:0;
    }
    #hud p, #hud .hint { display:none; }
    #zoneButtons { grid-column:1 / -1; display:flex; gap:6px; min-width:0; overflow-x:auto; }
    #zoneButtons button { flex:none; width:auto; margin:0; white-space:nowrap; }
    #hud > #overviewBtn, #hud > #hexBtn { width:auto; min-height:38px; margin:0; white-space:nowrap; }
    #hudOpen:not([hidden]) {
      display:flex; align-items:center; position:fixed; top:8px; right:8px; z-index:6;
      width:auto; min-height:40px; margin:0; padding:7px 12px;
      background:var(--panel); border:1px solid var(--line); border-radius:10px;
      color:var(--ink); cursor:pointer; font:inherit; backdrop-filter:blur(8px);
    }
    #panel {
      top:auto; right:8px; bottom:8px; left:8px; width:auto;
      max-height:52vh; max-height:52dvh; padding:16px;
      transform:translateY(calc(100% + 16px));
    }
    #panel.open { transform:translateY(0); }
    #panel h2 { padding-right:32px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">Raising the tents, aligning the telescope…</div>

<div id="hud">
  <h1>Tacit Mosaic Music Festival</h1>
  <button id="hudClose" type="button" aria-label="Hide festival controls" aria-controls="hud">×</button>
  <p>Five tacit-knowledge categories as one night: a festival under an observing sky.</p>
  <div id="zoneButtons"></div>
  <button id="overviewBtn" style="justify-content:center;margin-top:8px">↺ Overview</button>
  <button id="hexBtn" style="justify-content:center"><span class="dot" style="background:#ffcf5a"></span>Look up: Winter Hexagon</button>
  <div class="hint">Drag to orbit · scroll to zoom · click a zone or label</div>
</div>
<button id="hudOpen" type="button" aria-label="Show festival controls" aria-controls="hud" aria-expanded="false" hidden>☰ Controls</button>

<aside id="panel"><button id="close" aria-label="Close">×</button><div id="panelBody"></div></aside>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ---------- Data (from get_category_overview, 2026-11-21) ----------
const ZONES = {
  stage: {
    name: 'Main Stage', color: '#ff5fa2', sessions: 28, dist: [25,35,40],
    range: 'Dec 2025 – Oct 2026',
    overview: 'Live-event production as an interconnected system of technical infrastructure, human coordination, audience psychology, and mediated experience. The priority is preserving safety, trust, and momentum when real conditions diverge from plans.',
    themes: ['Operational resilience through rapid recovery and coordinated adaptation','Audience attention, collective energy, perception, and event memory','Human factors, trusted cues, and leadership under pressure','Transitions, pacing, schedule drift, and program continuity','Technical reliability and cross-department dependencies','Livestream framing and digital storytelling','Safety across crowd incidents, environmental hazards, contentious expression','Artist, sponsor, and audience trust during programming changes'],
    insight: 'Recovery is a recurring measure of competence: composed leadership and rehearsed alternatives often matter more to perceived professionalism than the absence of mistakes.'
  },
  concessions: {
    name: 'Concessions', color: '#ffb347', sessions: 27, dist: [15,40,45],
    range: 'Dec 2025 – Oct 2026',
    overview: 'Festival food and retail as a system of customer behavior, workflow, infrastructure, and event conditions. Perceived performance — visible progress, orderly queues, fairness — shapes satisfaction as strongly as price or wait time.',
    themes: ['Queue psychology, perceived waiting, fairness, and trust','Decisions via defaults, social proof, pricing cues, fatigue','End-to-end throughput and migrating bottlenecks','Staff capacity, burnout, and informal workarounds','Demand shifts from weather, programming, media, controversy','Resilience across inventory, suppliers, power, payments','Layout, accessibility, cleanliness, circulation, safety','Frontline observation and evidence-based diagnosis'],
    insight: 'Bottlenecks are dynamic: faster ordering, digital adoption, and workarounds relocate constraints rather than eliminate them.'
  },
  arts: {
    name: 'Arts & Crafts', color: '#5fe0c0', sessions: 27, dist: [10,35,55],
    range: 'Dec 2025 – Oct 2026',
    overview: 'Designing and sustaining participatory experiences — how people move from observing to participating, stay engaged, and develop ownership and belonging. Layout, shade, acoustics, and sightlines shape participation.',
    themes: ['Lowering barriers with clear invitations and quick wins','Facilitator influence, social proof, group dynamics','Inclusive spatial design, comfort, accessibility, families','Creative ownership, psychological safety, community dialogue','Hybrid participation, documentation, shareability','Operational continuity and staffing resilience','Balancing growth, sponsorship, and meaningful experience','Learning from observation, stories, early warning signals'],
    insight: 'Participation is a threshold problem, not a lack-of-interest problem: perceived skill, time, and social risk decide whether someone starts.'
  },
  setup: {
    name: 'Setting Up', color: '#6fa8ff', sessions: 26, dist: [25,35,40],
    range: 'Dec 2025 – Oct 2026',
    overview: 'Setup as the design of an interconnected event operating system. The central concern is hidden dependency: reasonable decisions create downstream failures through sequencing, shared infrastructure, and cross-team handoffs. (Shown here as the power cables feeding every zone.)',
    themes: ['Hidden dependencies, critical paths, cascading effects','Cross-team coordination and clear decision authority','Human behavior under pressure and normalized shortcuts','Resilience via realistic testing and independent redundancy','Spatial design for flow, access, and safe infrastructure','Continuous verification over apparent progress','Institutional learning via documented workarounds','Expanding scope: sponsorship, media, digital, incidents'],
    insight: 'The most consistent unit of risk is the interface between systems or teams, not an isolated component.'
  },
  astro: {
    name: 'Astronomy', color: '#b49bff', sessions: 8, dist: [40,25,35],
    range: 'Aug 2025 – Oct 2026',
    overview: 'Hands-on amateur astronomy: sky navigation, visual observing, equipment care, and a growing astrophotography practice — up to a Saturn imaging workflow on a PowerSeeker 127EQ with a NexImage 5, oaCapture, and Lynkeos.',
    themes: ['Sky navigation via bright stars, constellations, asterisms','Planetary observation: phases, moons, faint colors, rings','From smartphone photos to dedicated planetary imaging','Adapting to weather, seeing, glare, short windows','Equipment prep, alignment, maintenance, field workflows','Filters: viewing comfort vs. recoverable detail','Wonder connected to systematic technical investigation'],
    insight: 'Pattern recognition links domains: constellation geometry supports navigation, Jupiter’s moon spacing reveals change, and image structure separates real detail from processing artifacts.'
  }
};
const DIST_COLORS = ['#6fa8ff', '#b49bff', '#5fe0c0'];

// ---------- Renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position:'fixed', top:0, left:0, pointerEvents:'none' });
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#05070f');
scene.fog = new THREE.FogExp2('#070a16', 0.0022);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 3000);
const HOME = { pos: new THREE.Vector3(150, 120, 190), target: new THREE.Vector3(0, 10, -20) };
camera.position.copy(HOME.pos);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME.target);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.92; // allow looking up at the sky
controls.minDistance = 15; controls.maxDistance = 600;

scene.add(new THREE.HemisphereLight('#4a5aa0', '#16200f', 1.1));
const moon = new THREE.DirectionalLight('#a9b8ff', 1.1);
moon.position.set(-200, 300, -100);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, { left:-200, right:200, top:200, bottom:-200, far:800 });
scene.add(moon);

// ---------- helpers ----------
const mat = (color, opts = {}) => new THREE.MeshStandardMaterial({ color, roughness: .8, ...opts });
const glow = (color, intensity = 2) => new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: intensity });
const zoneGroups = {};
const clickables = [];
function makeZone(key, x, z) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.userData.zone = key;
  scene.add(g); zoneGroups[key] = g; clickables.push(g); return g;
}
function addLabel(key, parent, y) {
  const el = document.createElement('div');
  el.className = 'label';
  el.innerHTML = `<b style="background:${ZONES[key].color}"></b>${ZONES[key].name} · ${ZONES[key].sessions}`;
  el.addEventListener('click', e => { e.stopPropagation(); focusZone(key); });
  const obj = new CSS2DObject(el); obj.position.set(0, y, 0); parent.add(obj);
}
function shadowAll(o) { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); }

// ---------- Ground ----------
const ground = new THREE.Mesh(new THREE.CircleGeometry(900, 96), mat('#0d1a10', { roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const field = new THREE.Mesh(new THREE.CircleGeometry(95, 64), mat('#13261a', { roughness: 1 }));
field.rotation.x = -Math.PI / 2; field.position.y = 0.05; field.receiveShadow = true; scene.add(field);

// distant tree line
const treeGeo = new THREE.ConeGeometry(4, 16, 6);
// white base so per-tree colours show; faint green emissive so they read in moonlight
const trees = new THREE.InstancedMesh(treeGeo, mat('#ffffff', { emissive: '#0c2414', emissiveIntensity: 1 }), 260);
const treeGreens = ['#2f6b3a', '#3c7d45', '#275c33', '#4a8a4f', '#356f40'];
const dummy = new THREE.Object3D();
for (let i = 0; i < 260; i++) {
  const a = Math.random() * Math.PI * 2, r = 180 + Math.random() * 120;
  const s = .7 + Math.random() * 1.2;
  dummy.position.set(Math.cos(a) * r, 8 * s, Math.sin(a) * r);
  dummy.scale.setScalar(s); dummy.updateMatrix(); trees.setMatrixAt(i, dummy.matrix);
  trees.setColorAt(i, new THREE.Color(treeGreens[i % treeGreens.length]).offsetHSL(0, 0, (Math.random() - .5) * .06));
}
scene.add(trees);

// ---------- Crowd helper ----------
const personGeo = new THREE.CapsuleGeometry(0.45, 1.1, 3, 6);
const crowds = [];
function addCrowd(count, placeFn, colors) {
  const m = new THREE.InstancedMesh(personGeo, mat('#ffffff', { roughness: .6 }), count);
  const base = [];
  for (let i = 0; i < count; i++) {
    const p = placeFn(i); base.push({ ...p, phase: Math.random() * 6.28 });
    dummy.position.set(p.x, 1, p.z); dummy.updateMatrix(); m.setMatrixAt(i, dummy.matrix);
    m.setColorAt(i, new THREE.Color(colors[i % colors.length]));
  }
  m.castShadow = true; scene.add(m); crowds.push({ m, base, bob: placeFn.bob ?? 0 });
  return m;
}
const shirtColors = ['#e85d75','#5d8ae8','#f2c14e','#7bd389','#c792ea','#f78c6b','#e0e0e0','#4ecdc4'];

// ---------- MAIN STAGE ----------
const stage = makeZone('stage', 0, -55);
{
  const deck = new THREE.Mesh(new THREE.BoxGeometry(44, 3, 20), mat('#1b1d26'));
  deck.position.y = 1.5; stage.add(deck);
  const back = new THREE.Mesh(new THREE.BoxGeometry(44, 22, 1), mat('#0f1018'));
  back.position.set(0, 14, -9.5); stage.add(back);
  // LED wall
  const ledCanvas = document.createElement('canvas'); ledCanvas.width = 256; ledCanvas.height = 128;
  const ledTex = new THREE.CanvasTexture(ledCanvas); ledTex.colorSpace = THREE.SRGBColorSpace;
  const led = new THREE.Mesh(new THREE.PlaneGeometry(28, 13), new THREE.MeshBasicMaterial({ map: ledTex }));
  led.position.set(0, 13, -8.9); stage.add(led);
  stage.userData.led = { ctx: ledCanvas.getContext('2d'), tex: ledTex };
  // truss
  const trussMat = mat('#8a8f9c', { metalness: .8, roughness: .35 });
  for (const x of [-21, 21]) {
    const t = new THREE.Mesh(new THREE.BoxGeometry(1.2, 28, 1.2), trussMat); t.position.set(x, 14, 8); stage.add(t);
  }
  const top = new THREE.Mesh(new THREE.BoxGeometry(43.2, 1.2, 1.2), trussMat); top.position.set(0, 28, 8); stage.add(top);
  // speakers
  for (const x of [-25, 25]) {
    const s = new THREE.Mesh(new THREE.BoxGeometry(4, 10, 4), mat('#111')); s.position.set(x, 5, 6); stage.add(s);
  }
  // band (little performers)
  for (const [x, c] of [[-8,'#ff5fa2'],[0,'#ffffff'],[8,'#6fa8ff']]) {
    const p = new THREE.Mesh(personGeo, glow(c, .6)); p.position.set(x, 4.1, 0); p.scale.setScalar(1.2); stage.add(p);
  }
  // light beams
  const beams = [];
  const beamColors = ['#ff5fa2','#6fa8ff','#ffe36b','#5fe0c0','#ff5fa2','#b49bff'];
  beamColors.forEach((c, i) => {
    const pivot = new THREE.Group(); pivot.position.set(-18 + i * 7.2, 27.4, 8); stage.add(pivot);
    const cone = new THREE.Mesh(new THREE.ConeGeometry(6, 40, 24, 1, true),
      new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: .12, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
    cone.position.y = -20; pivot.add(cone);
    const lamp = new THREE.Mesh(new THREE.CylinderGeometry(.7, .9, 1.4, 12), glow(c, 3)); pivot.add(lamp);
    beams.push({ pivot, phase: i * 1.1 });
  });
  stage.userData.beams = beams;
  const wash = new THREE.PointLight('#ff5fa2', 600, 90, 1.6); wash.position.set(0, 20, 22); stage.add(wash);
  stage.userData.wash = wash;
  shadowAll(stage);
  addLabel('stage', stage, 34);
}
const stageCrowd = addCrowd(420, () => {
  const a = (Math.random() - .5) * Math.PI * .85, r = 14 + Math.sqrt(Math.random()) * 30;
  return { x: Math.sin(a) * r * 1.2, z: -55 + 12 + Math.cos(a) * r };
}, shirtColors);
crowds[crowds.length - 1].bob = 1;

// ---------- CONCESSIONS ----------
const conc = makeZone('concessions', 62, 8);
{
  const truckColors = ['#d9534f', '#f0ad4e', '#5bc0de', '#e8e2d0'];
  truckColors.forEach((c, i) => {
    const t = new THREE.Group(); t.position.set(0, 0, -21 + i * 14); t.rotation.y = -Math.PI / 2; conc.add(t);
    const body = new THREE.Mesh(new THREE.BoxGeometry(11, 6, 5), mat(c, { roughness: .5 })); body.position.y = 4; t.add(body);
    const cab = new THREE.Mesh(new THREE.BoxGeometry(3, 4, 4.6), mat(c, { roughness: .5 })); cab.position.set(6.8, 3, 0); t.add(cab);
    const win = new THREE.Mesh(new THREE.PlaneGeometry(6, 2.4), glow('#ffd58a', 1.6)); win.position.set(0, 4.6, 2.51); t.add(win);
    const awn = new THREE.Mesh(new THREE.BoxGeometry(7, .2, 2), mat('#ffffff')); awn.position.set(0, 6.3, 3.4); awn.rotation.x = -.35; t.add(awn);
    for (const wx of [-3.5, 3.5, 6.8]) {
      const w = new THREE.Mesh(new THREE.CylinderGeometry(.9, .9, .7, 14), mat('#111')); w.rotation.x = Math.PI / 2; w.position.set(wx, .9, 2.3); t.add(w);
    }
    const lamp = new THREE.PointLight('#ffcf80', 40, 18, 2); lamp.position.set(0, 5, 5); t.add(lamp);
  });
  // string lights (catenary)
  const bulbGeo = new THREE.SphereGeometry(.28, 8, 6);
  const bulbs = new THREE.InstancedMesh(bulbGeo, new THREE.MeshBasicMaterial({ color: '#ffd27a' }), 120);
  let k = 0;
  for (let seg = 0; seg < 4; seg++) {
    const z0 = -28 + seg * 14, z1 = z0 + 14;
    for (let j = 0; j < 30; j++) {
      const u = j / 29, z = z0 + (z1 - z0) * u, sag = 4 * u * (1 - u) * 2.4;
      dummy.position.set(-8, 10 - sag, z); dummy.scale.setScalar(1); dummy.updateMatrix(); bulbs.setMatrixAt(k++, dummy.matrix);
    }
  }
  conc.add(bulbs);
  for (let i = 0; i < 5; i++) {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(.25, .25, 10.5, 8), mat('#5a4a3a')); pole.position.set(-8, 5.25, -28 + i * 14); conc.add(pole);
  }
  shadowAll(conc);
  addLabel('concessions', conc, 16);
}
// queues: lines of people walking slowly toward windows
const queueCrowd = addCrowd(48, i => {
  const q = Math.floor(i / 12), n = i % 12;
  return { x: 62 - 5.5 - n * 1.9 - Math.random() * .4, z: 8 - 21 + q * 14 + (Math.random() - .5) * .8, queue: true };
}, shirtColors);

// ---------- ARTS & CRAFTS ----------
const arts = makeZone('arts', -62, 8);
{
  const canopyColors = ['#5fe0c0', '#f2c14e', '#e85d75'];
  canopyColors.forEach((c, i) => {
    const t = new THREE.Group(); t.position.set((i - 1) * 2, 0, -18 + i * 16); arts.add(t);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(7.5, 3.5, 4), mat(c, { roughness: .9 }));
    roof.position.y = 8.7; roof.rotation.y = Math.PI / 4; t.add(roof);
    for (const [x, z] of [[-5,-5],[5,-5],[-5,5],[5,5]]) {
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(.18, .18, 7, 6), mat('#cccccc', { metalness: .6 })); leg.position.set(x, 3.5, z); t.add(leg);
    }
    const table = new THREE.Mesh(new THREE.BoxGeometry(8, .4, 3), mat('#7a5b3a')); table.position.y = 2.6; t.add(table);
    for (let j = 0; j < 7; j++) {
      const piece = new THREE.Mesh(new THREE.BoxGeometry(.7, .4 + Math.random() * .8, .7), glow(shirtColors[(j + i) % 8], .35));
      piece.position.set(-3.2 + j * 1.05, 3.1, (Math.random() - .5) * 1.6); t.add(piece);
    }
    const lamp = new THREE.PointLight(c, 50, 16, 2); lamp.position.set(0, 6.5, 0); t.add(lamp);
  });
  // community mural with procedurally painted blobs
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256;
  const cx = cv.getContext('2d');
  cx.fillStyle = '#f4efe4'; cx.fillRect(0, 0, 512, 256);
  for (let i = 0; i < 140; i++) {
    cx.fillStyle = shirtColors[i % 8] + 'cc';
    cx.beginPath(); cx.arc(Math.random() * 512, Math.random() * 256, 6 + Math.random() * 26, 0, 7); cx.fill();
  }
  cx.fillStyle = '#1b1d26'; cx.font = 'bold 34px sans-serif'; cx.textAlign = 'center';
  cx.fillText('everyone made this', 256, 140);
  const muralTex = new THREE.CanvasTexture(cv); muralTex.colorSpace = THREE.SRGBColorSpace;
  const mural = new THREE.Mesh(new THREE.PlaneGeometry(18, 9), new THREE.MeshStandardMaterial({ map: muralTex, emissive: '#ffffff', emissiveMap: muralTex, emissiveIntensity: .35 }));
  mural.position.set(-10, 5.5, 0); mural.rotation.y = Math.PI / 2; arts.add(mural);
  const muralFrame = new THREE.Mesh(new THREE.BoxGeometry(.5, 10, 19), mat('#3a2e22')); muralFrame.position.set(-10.3, 5.5, 0); arts.add(muralFrame);
  shadowAll(arts);
  addLabel('arts', arts, 16);
}
addCrowd(70, i => {
  // participants clustered at tables, a few observers hanging back (the "threshold")
  const t = i % 3, observer = i % 5 === 0;
  const cxp = -62 + (t - 1) * 2, czp = 8 - 18 + t * 16;
  const a = Math.random() * 6.28, r = observer ? 9 + Math.random() * 3 : 3 + Math.random() * 2.5;

// Real positions (RA in hours, Dec in degrees), projected onto a patch of sky centred at az/alt.
const HEX_CENTER = { az: 110, alt: 40, ra: 6.2, dec: 11.8, scale: .55 };
function skyLocal(xDeg, yDeg, r = DOME - 20) {
  const c = sky(HEX_CENTER.az, HEX_CENTER.alt, 1);
  const right = new THREE.Vector3().crossVectors(c, new THREE.Vector3(0, 1, 0)).normalize();
  const upL = new THREE.Vector3().crossVectors(right, c).normalize();
  const D = THREE.MathUtils.degToRad;
  return c.clone().add(right.multiplyScalar(Math.tan(D(xDeg)))).add(upL.multiplyScalar(Math.tan(D(yDeg)))).normalize().multiplyScalar(r);
}
function raDec(ra, dec) {
  const x = -(ra - HEX_CENTER.ra) * 15 * Math.cos(THREE.MathUtils.degToRad(HEX_CENTER.dec)); // RA grows eastward = leftward on the sky
  return skyLocal(x * HEX_CENTER.scale, (dec - HEX_CENTER.dec) * HEX_CENTER.scale);
}

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => downAt = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(clickables, true)[0];
  if (!hit) return;
  let o = hit.object; while (o && !o.userData.zone) o = o.parent;
  if (o) focusZone(o.userData.zone);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
});

// ---------- Animate ----------
const clock = new THREE.Clock();
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const washColors = ['#ff5fa2', '#6fa8ff', '#b49bff', '#5fe0c0'].map(c => new THREE.Color(c));
function tick() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  const beat = Math.pow(Math.max(0, Math.sin(t * Math.PI * 2 * 2)), 6); // ~120 bpm

  // stage
  for (const b of stage.userData.beams) {
    b.pivot.rotation.z = Math.sin(t * .8 + b.phase) * .55;
    b.pivot.rotation.x = .35 + Math.cos(t * .6 + b.phase) * .3;
  }
  const wi = Math.floor(t / 4) % washColors.length;
  stage.userData.wash.color.lerp(washColors[wi], .03);
  stage.userData.wash.intensity = 400 + beat * 700;
  const { ctx, tex } = stage.userData.led;
  for (let x = 0; x < 16; x++) for (let y = 0; y < 8; y++) {
    const v = Math.sin(x * .6 + t * 3) + Math.cos(y * .9 - t * 2) + beat * 2;
    ctx.fillStyle = `hsl(${(t * 40 + x * 12 + v * 30) % 360},85%,${30 + v * 12}%)`; ctx.fillRect(x * 16, y * 16, 15, 15);
  }
  tex.needsUpdate = true;

  // crowds
  crowds.forEach((c, ci) => {
    c.base.forEach((p, i) => {
      let y = 1;
      if (c.bob) y += beat * .9 * (.5 + .5 * Math.sin(p.phase)) ;
      else y += Math.abs(Math.sin(t * 2 + p.phase)) * .08;
      let x = p.x;
      if (p.queue) x += Math.sin(t * .3 + p.phase) * .15;
      dummy.position.set(x, y, p.z); dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(1); dummy.updateMatrix(); c.m.setMatrixAt(i, dummy.matrix);
    });
    c.m.instanceMatrix.needsUpdate = true;
  });

  // power pulses
  for (const c of cables) for (const p of c.pulses) {
    p.u = (p.u + dt * c.speed) % 1; p.s.position.copy(c.curve.getPointAt(p.u)); p.s.position.y += .3;
  }

  // sky
  saturn.rotation.y += dt * .05;
  jMoons.forEach(j => { const a = t * j.w * .2 + j.ph; j.m.position.set(Math.cos(a) * j.r, 0, Math.sin(a) * j.r * .2); });
  constLines.forEach(l => l.material.opacity = .35 + .15 * Math.sin(t * .7));

  // camera flight
  if (fly) {
    fly.t = Math.min(1, fly.t + dt / 1.6); const k = ease(fly.t);
    camera.position.lerpVectors(fly.p0, fly.p1, k); controls.target.lerpVectors(fly.t0, fly.t1, k);
    if (fly.t >= 1) fly = null;
  }
  controls.update();
  if (camera.position.y < 3) camera.position.y = 3; // never go underground
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
const ld = document.getElementById('loading'); ld.style.opacity = 0; setTimeout(() => ld.remove(), 700);
</script>
</body>
</html>
